name: 采集源健康巡检

on:
  schedule:
    - cron: '0 19 * * *'   # 每天 UTC 19:00（北京时间 03:00）
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 运行巡检
        run: node scripts/check-sources.mjs
      - name: 提交结果
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/source-health.json
          if git diff --cached --quiet; then
            echo "无变化"
          else
            git commit -m "chore(health): update source health $(date -u +%Y-%m-%d)"
            git push
          fi
